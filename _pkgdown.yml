url: https://dataniel.github.io/pnrr

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/dataniel/pnrr

home:
  strip_header: true

reference:
  - title: Diagnose and standardise
    contents:
      - diagnose_cpr
      - clean_cpr

  - title: Derive
    desc: >
      `add_cpr_info()` adds several columns in one pass; the `cpr_*()`
      functions give one vector each, for `mutate()` and `filter()`.
    contents:
      - add_cpr_info
      - age
      - cpr_birth_date
      - cpr_age

  - title: Pseudonymise
    contents:
      - pseudo_cpr

  - title: Package
    contents:
      - pnrr-package
